# Model catalog.
#
# Every file is pinned by repository revision, size and SHA-256. A model is never
# loaded from a file that has not passed verification.
#
# Variants are tried in order; the first one whose `archs` contains the user's GPU
# architecture (empty = any) and whose `min_vram_gb` fits is chosen.
# A variant lists file keys from the model's `files` table; files shared between
# variants or models (same `name`) are downloaded once.
#
# `dir` is the ComfyUI model folder under models/.

schema = 1

[[models]]
id = "z-image-turbo"
name = "Z-Image Turbo"
vendor = "Tongyi-MAI (Alibaba)"
description = "Fast photorealistic text-to-image in 8 steps. Strong at people, products and legible text."
tasks = ["generate"]
pipeline = "z_image"
license = "Apache-2.0"
license_url = "https://huggingface.co/Tongyi-MAI/Z-Image-Turbo"
commercial_use = true

[models.defaults]
steps = 8
cfg = 1.0
sampler = "res_multistep"
scheduler = "simple"
shift = 3.0

