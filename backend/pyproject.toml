[project]
name = "photo"
version = "0.1.0.dev0"
description = "Local AI image generation and editing studio for NVIDIA RTX GPUs."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "httpx>=0.28,<1",
    "websockets>=15",
    "pillow>=12",
    "typer>=0.20",
    "rich>=14",
]

[project.scripts]
photo = "photo.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo"]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["gpu: needs a real NVIDIA GPU, engine and model (run with -m gpu)"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH", "N"]
ignore = [
    "S101",    # asserts document invariants
    "N818",    # exception names describe the condition
    "PTH105",  # os.replace is the clearest spelling of an atomic swap
    "RUF001",  # typographic characters in user-facing text are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "ASYNC240"]
"src/photo/engine/boot.py" = ["PTH"]  # runs on the engine interpreter, kept minimal

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["psutil"]  # only imported by boot.py inside the engine environment
ignore_missing_imports = true
