name: Release

# Push a tag like v0.1.0 to build the downloadable packages and draft a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run
          npm run build

      - name: Assemble packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="Photo-${version}"
          mkdir -p dist
          # Exactly the tracked files of this tag, plus the built UI.
          git archive --format=tar --prefix="${name}/" HEAD | tar -x -C dist
          cp -r frontend/dist "dist/${name}/frontend/dist"
          (cd dist && zip -qr "${name}-windows.zip" "${name}")
          (cd dist && tar -czf "${name}-linux.tar.gz" "${name}")
          (cd dist && sha256sum "${name}-windows.zip" "${name}-linux.tar.gz" > SHA256SUMS.txt)
          ls -la dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          gh release create "${version}" --draft --verify-tag \
            --title "Photo ${version}" --generate-notes \
            "dist/Photo-${version}-windows.zip" \
            "dist/Photo-${version}-linux.tar.gz" \
            dist/SHA256SUMS.txt
